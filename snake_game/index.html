<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Canvas</title>
        <script defer src="index.js"></script>
        <style>
            body{
                max-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                overflow: hidden;
            }

            .game-data{
                display: flex;
                justify-content: center;
                gap: 20px;
                align-items: flex-end;
                font-size: 18px;
                line-height: 1;
                margin-bottom: 10px;
            }

            #score{
                font-size: 18px;
                line-height: 1;
            }

            dialog{
                text-align: center;
                padding: 50px;

                & .content{
                    font-size: 24px;
                    line-height: 1.5;
                }

                & button{
                    padding: 0.5em 1.5em;
                    border: 1px solid #000;
                    background: transparent;
                    font-size: 18px;
                    line-height: 1.5;
                    border-radius: 48px;
                    transition: .3s;
                    cursor: pointer;

                    &:hover{
                        background: #000;
                        color: #fff;
                    }
                }
            }
        </style>
    </head>
    <body>
        <div class="game-data">
            <div id="score">Score: 0</div>
            <div id="highscore">HighScore: 0</div>
            <div id="level">Level: 1</div>
        </div>
        <canvas id="canvas"></canvas>
        <dialog closedby="closerequest" id="start-ui">
            <div class="content">
                <p>Press <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> arrow keys to move the snake.</p>
            </div>
            <button autofocus>Start Game</button>
        </dialog>

        <dialog closedby="closerequest" id="restart-ui">
            <p>Game Over!</p>
            <button autofocus>Restart Game</button>
        </dialog>
    </body>
</html>
